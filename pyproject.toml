[project]
name = "aibooks"
version = "0.1.0"
description = "LLM-ready document and ebook ingestion system with deep agentic self-learning"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Michał", email = ""}
]
dependencies = [
    # Core parsing
    "docling>=1.0.0",
    "docling-core>=1.0.0",

    # Calibre metadata (subprocess-based, requires calibre installed)

    # Agentic framework
    "langgraph>=0.0.40",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",

    # Document processing
    "pypdf>=3.17.0",
    "pymupdf>=1.23.0",
    "python-docx>=1.1.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.5.0",

    # OCR
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",

    # Text processing
    "rapidfuzz>=3.5.0",
    "unidecode>=1.3.0",
    "ftfy>=6.1.0",
    "python-magic>=0.4.27",

    # LLM & AI
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "tiktoken>=0.5.0",

    # Utilities
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "loguru>=0.7.0",

    # Hashing & crypto
    "xxhash>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
aibooks = "aibooks.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
